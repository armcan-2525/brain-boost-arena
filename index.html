<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Boost Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
  <!-- GAME OVER SCREEN -->
<div id="gameOver" class="overlay hidden">
  <div class="card gameover-card">
    <h2>💀 Game Over</h2>
    <p id="finalScore">คะแนน: 0</p>

    <button onclick="restartGame()">🔄 เล่นใหม่</button>
    <button onclick="changeProfile()">👤 เปลี่ยนผู้เล่น</button>
  </div>
</div>

<body>

<div class="card">

  <h1>🧠 Brain Boost Arena</h1>

  <div id="setup">
    <input id="playerName" placeholder="ชื่อผู้เล่น">
    <select id="mode">
      <option value="number">🔢 ตัวเลข</option>
      <option value="thai">ก-ฮ ภาษาไทย</option>
      <option value="eng">A-Z English</option>
    </select>
    <button onclick="startGame()">เริ่มเกม</button>
<button id="soundBtn" onclick="toggleSound()">
  🔊
</button>

<audio id="bgm" src="audio/bgm.mp3" loop></audio>

  </div>

  <div class="game hidden">
    <div id="level">Lv.1</div>
    <div id="display"></div>
    <div id="grid" class="grid"></div>
  </div>

</div>

<script src="js/game.js"></script>
</body>
</html>
<div class="app">
  <div class="screen card">
    <!-- ของเดิมทั้งหมดอยู่ตรงนี้ -->
  </div>
</div>
