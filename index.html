<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Boost Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

  <!-- ========== SETUP / HOME ========== -->
  <div id="setup" class="card home-card">
    <h1>🧠 Brain Boost Arena</h1>

    <input id="playerName" placeholder="ชื่อผู้เล่น">

    <select id="mode" onchange="renderRank()">
      <option value="number">🔢 ตัวเลข</option>
      <option value="thai">ก-ฮ ภาษาไทย</option>
      <option value="eng">A-Z English</option>
    </select>

    <button class="start-btn" onclick="startGame()">▶ เริ่มเกม</button>

    <button id="soundBtn" class="sound-btn" onclick="toggleSound()">🔊</button>

    <!-- RANK แสดงเฉพาะหน้าแรก -->
    <div class="rank-card">
      <h3>🏆 TOP 10</h3>
      <ol id="rankList"></ol>
    </div>
  </div>

  <!-- ========== GAME ========== -->
  <div class="game hidden">
    <div id="level">Lv.1</div>
    <div id="display"></div>
    <div id="grid" class="grid"></div>
  </div>

</div>

<!-- ========== GAME OVER ========== -->
<div id="gameOver" class="overlay hidden">
  <div class="card gameover-card">
    <h2>💀 Game Over</h2>
    <p id="finalScore">คะแนน: 0</p>
    <button onclick="restartGame()">🔄 เล่นใหม่</button>
    <button onclick="changeProfile()">👤 เปลี่ยนผู้เล่น</button>
  </div>
</div>

<audio id="bgm" src="audio/bgm.mp3" loop></audio>

<script src="js/game.js"></script>
</body>
</html>
