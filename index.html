<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Boost Arena</title>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#1b0f2f,#3a1c71);color:#fff;text-align:center;margin:0;padding:20px}
.card{background:#241046;border-radius:16px;padding:20px;max-width:560px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{margin-top:0}
input,select,button{padding:10px;border-radius:20px;border:none;margin:5px}
button{background:#ffcc00;font-weight:bold;cursor:pointer}
.grid{display:grid;gap:8px;margin:15px 0}
.cell{background:#4b2a85;padding:15px;border-radius:10px;font-size:18px;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.cell:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.cell.hidden{color:transparent}
.cell.correct{background:#2ecc71;animation:pop .4s ease}
.cell.wrong{background:#e74c3c;animation:shake .4s ease}
.level{margin:5px 0;font-size:14px;opacity:.9}
table{width:100%;margin-top:10px;border-collapse:collapse;font-size:14px}
th,td{padding:6px;border-bottom:1px solid rgba(255,255,255,.2)}
#restartBtn{display:none;background:#00e0ff;color:#000}
#changeProfileBtn{display:none;background:#ff7ad9}
.share{font-size:13px;opacity:.9;word-break:break-all}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-6px)}100%{transform:translateX(0)}}
</style>
</head>
<body>
<div class="card">
<h1>🧠 Brain Boost Arena</h1>

<div id="setup">
<input id="playerName" placeholder="ชื่อผู้เล่น">
<select id="mode">
 <option value="number">🔢 ตัวเลข</option>
 <option value="thai">ก-ฮ พยัญชนะไทย</option>
 <option value="eng">A-Z ภาษาอังกฤษ</option>
</select>

<button onclick="startMatch()">เริ่มแข่ง</button>
</div>

<p class="level" id="levelText">เลเวล 1</p>
<p id="info"></p>
<div id="grid" class="grid"></div>
<p id="status"></p>

<button id="restartBtn" onclick="restartGame()">🔄 เริ่มเกมใหม่</button>
<button id="changeProfileBtn" onclick="changeProfile()">👤 เปลี่ยนโปรไฟล์</button>

<p class="share" id="shareLink"></p>

<h3>🏆 Top 10</h3>
<table>
<thead><tr><th>#</th><th>ชื่อ</th><th>คะแนน</th><th>แรงค์</th></tr></thead>
<tbody id="leaderboard"></tbody>
</table>
</div>

<audio id="snd-start" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
<audio id="snd-tick" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="snd-click" src="https://actions.google.com/sounds/v1/cartoon/wood_tap.ogg"></audio>
<audio id="snd-correct" src="https://actions.google.com/sounds/v1/cartoon/ascending_whistle.ogg"></audio>
<audio id="snd-wrong" src="https://actions.google.com/sounds/v1/cartoon/slide_whistle_to_drum_hit.ogg"></audio>
<audio id="snd-level" src="https://actions.google.com/sounds/v1/cartoon/clang.ogg"></audio>

<script>
let score=0, level=1, gridSize=4, revealTime=3000;

let answerIndex=0, player='', mode='number';
let countdownTimer=null, hideTimer=null;

const sndStart=document.getElementById('snd-start');
const sndTick=document.getElementById('snd-tick');
const sndClick=document.getElementById('snd-click');
const sndCorrect=document.getElementById('snd-correct');
const sndWrong=document.getElementById('snd-wrong');
const sndLevel=document.getElementById('snd-level');

function startMatch(){
 sndStart.play();
 player=document.getElementById('playerName').value||'Player';
 mode=document.getElementById('mode').value;
 
 document.getElementById('setup').style.display='none';
 score=0; level=1; gridSize=4;
 startGame();
}

function restartGame(){
 sndStart.play();
 score=0; level=1; gridSize=4;
 document.getElementById('status').innerText='';
 document.getElementById('restartBtn').style.display='none';
 document.getElementById('changeProfileBtn').style.display='none';
 startGame();
}

function changeProfile(){
 sndClick.play();
 document.getElementById('setup').style.display='block';
 document.getElementById('grid').innerHTML='';
 document.getElementById('info').innerText='';
 document.getElementById('status').innerText='';
 document.getElementById('restartBtn').style.display='none';
 document.getElementById('changeProfileBtn').style.display='none';
}

function updateLevel(){
 const prev=level;
 level=Math.floor(score/100)+1;
 gridSize=4+(level-1);
 if(level>=4){ revealTime=5000; }
 else if(level>=2){ revealTime=4000; }
 else{ revealTime=3000; }
 if(level>prev) sndLevel.play();
 document.getElementById('levelText').innerText=`เลเวล ${level}`;
}

function generatePool(total){
 let pool=[];
 if(mode==='number'){
  if(level>=4){ for(let i=100;i<=999;i++) pool.push(i); }
  else{ for(let i=10;i<=99;i++) pool.push(i); }
 }
 if(mode==='thai'){
  const th='กขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ'.split('');
  pool=[...th];
 }
 if(mode==='eng'){
  pool=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));
 }
 for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
 return pool.slice(0,total);
}

function startCountdown(sec){
 clearInterval(countdownTimer);
 let r=sec;
 countdownTimer=setInterval(()=>{
  sndTick.currentTime=0; sndTick.play();
  r--; if(r<=0) clearInterval(countdownTimer);
 },1000);
}

function hideNumbers(){ document.querySelectorAll('.cell').forEach(c=>c.classList.add('hidden')); }

function startGame(){
 updateLevel();
 const grid=document.getElementById('grid');
 grid.innerHTML='';
 grid.style.gridTemplateColumns=`repeat(${gridSize},1fr)`;
 const total=gridSize*gridSize;
 answerIndex=Math.floor(Math.random()*total);
 const items=generatePool(total);
 const target=items[answerIndex];
 document.getElementById('info').innerText=`🎯 ${player} | หา: ${target} | คะแนน: ${score}`;
 document.getElementById('status').innerText='';

 

 items.forEach((n,i)=>{
  const c=document.createElement('div');
  c.className='cell'; c.innerText=n;
  c.onclick=()=>{ sndClick.play(); check(c,i); };
  grid.appendChild(c);
 });

 clearTimeout(hideTimer);
 hideTimer=setTimeout(hideNumbers,revealTime);
 startCountdown(revealTime/1000);
}

function check(cell,i){
 document.querySelectorAll('.cell').forEach((c,idx)=>{
  if(idx===answerIndex) c.classList.add('correct');
  c.classList.remove('hidden'); c.onclick=null;
 });
 if(i===answerIndex){ sndCorrect.play(); score+=10; document.getElementById('status').innerText='✅ ถูกต้อง +10'; setTimeout(startGame,1500); }
 else{ sndWrong.play(); document.getElementById('status').innerText='❌ ตอบผิด เกมจบ'; endMatch(); }
}

function endMatch(){
 saveScore(player,score,getRank(score));
 showBoard();
 document.getElementById('restartBtn').style.display='inline-block';
 document.getElementById('changeProfileBtn').style.display='inline-block';
 document.getElementById('shareLink').innerText='🔗 แชร์ให้เพื่อน: '+location.href;
}

function getRank(s){if(s>=300)return'Gold';if(s>=200)return'Silver';return'Bronze'}

function saveScore(n,s,r){ let d=JSON.parse(localStorage.getItem('bb_scores_'+mode)||'[]'); d.push({n,s,r}); d=d.sort((a,b)=>b.s-a.s).slice(0,10); localStorage.setItem('bb_scores_'+mode,JSON.stringify(d)); }

function showBoard(){ const b=document.getElementById('leaderboard'); b.innerHTML=''; const d=JSON.parse(localStorage.getItem('bb_scores_'+mode)||'[]'); d.forEach((x,i)=>b.innerHTML+=`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.s}</td><td>${x.r}</td></tr>`); }

showBoard();
</script>
</body>
</html>
